org: jesusdelgado
app: web-chat-ia
service: agente-ia-ticketpass

provider:
  name: aws
  runtime: python3.14
  stage: dev
  region: us-east-1
  role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    DYNAMODB_TABLE: chat-memory-ticketpass-${sls:stage}
    GROQ_API_KEY: ${env:GROQ_API_KEY}

functions:
  createChat:
    handler: handler.create_chat
    events:
      - http:
          path: chats
          method: post
          cors: true
  listChats:
    handler: handler.list_chats
    events:
      - http:
          path: chats
          method: get
          cors: true
  getChat:
    handler: handler.get_chat
    events:
      - http:
          path: chats/{chatId}
          method: get
          cors: true
  sendMessage:
    handler: handler.send_message
    events:
      - http:
          path: chats/{chatId}/messages
          method: post
          cors: true

resources:
  Resources:
    ChatMemoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: chat-memory-ticketpass-${sls:stage}
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST